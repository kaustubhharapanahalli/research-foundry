[pytest]
{%- if cookiecutter.get("backend_django") == "yes" %}
testpaths = backend
# Relative to this file, unlike testpaths, which is relative to the root.
pythonpath = ../backend
DJANGO_SETTINGS_MODULE = config.settings.test
# Settings and entry points configure Django at import; tests import them
# on purpose instead of letting doctest collection do it.
addopts = --strict-markers --strict-config -ra --doctest-modules --import-mode=importlib --ignore=backend/config --ignore=backend/manage.py
{%- else %}
testpaths = tests src
addopts = --strict-markers --strict-config -ra --doctest-modules --import-mode=importlib
{%- endif %}
markers =
    unit: fast, no files outside tmp_path, no subprocess, no GPU
    functional: whole commands or pipelines on tiny inputs, CPU only
    slow: excluded from make test, included in make ci
    gpu: needs a GPU; runs on the target machine before a real run, never in CI
