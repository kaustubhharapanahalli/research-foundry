[mypy]
python_version = {{ cookiecutter._python_floor }}
strict = True
{%- if cookiecutter.get("ml_pytorch") == "yes" %}
# Parts of torch, such as Tensor.backward, have no type annotations.
untyped_calls_exclude = torch
{%- endif %}
{%- if cookiecutter.get("backend_django") == "yes" %}
mypy_path = backend
explicit_package_bases = True
plugins = mypy_django_plugin.main, mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test
{%- else %}
mypy_path = src
explicit_package_bases = True
{%- endif %}
{%- if cookiecutter.get("gateway_litellm") == "yes" %}

# gateway/policy.py runs inside the LiteLLM image, which has these; the
# project's own environment does not.
[mypy-fastapi.*,litellm.*]
ignore_missing_imports = True
{%- endif %}
{%- if cookiecutter.get("public_docs") == "yes" %}

[mypy-yaml]
ignore_missing_imports = True
{%- endif %}
