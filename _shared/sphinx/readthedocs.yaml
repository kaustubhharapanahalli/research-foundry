# Read the Docs builds the docs for every release (PD13). Connect the
# repository at readthedocs.org once it is public.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "{{ cookiecutter.python_version }}"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
