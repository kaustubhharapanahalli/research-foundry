# The only definition of each text check. `make lint` runs this file.
# Formatters run in check mode only on LaTeX, so they never rewrite text
# that was just pulled from Overleaf.
minimum_pre_commit_version: "4.4.0"

exclude: ^(venue|build)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier (Markdown, YAML, JSON)
        entry: prettier --write --log-level warn
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        types_or: [markdown, yaml, json]
