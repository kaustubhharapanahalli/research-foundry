[project]
name = "research-foundry"
version = "0.2.0rc1"
description = "Cookiecutter templates for every kind of repository a research project needs, kept current with cruft."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kaustubh Harapanahalli" }]
keywords = [
    "cookiecutter",
    "cruft",
    "research",
    "templates",
    "reproducibility",
    "machine-learning",
    "latex",
    "django",
    "nextjs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = [
    "cookiecutter>=2.7.1",
    "cruft>=2.16.0",
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/kaustubhharapanahalli/research-foundry"
Source = "https://github.com/kaustubhharapanahalli/research-foundry"
Issues = "https://github.com/kaustubhharapanahalli/research-foundry/issues"
Changelog = "https://github.com/kaustubhharapanahalli/research-foundry/blob/main/CHANGELOG.md"
Documentation = "https://research-foundry.kaustubhharapanahalli.me/"

[project.scripts]
research-foundry = "research_foundry.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_foundry"]
exclude = [
    "methodology/templates",
    "workspace/templates",
    "paper/templates",
    "software/templates",
]

# The templates stay at the repository root, so `cruft create <url>
# --directory <template>` keeps working; the wheel carries the same tree.
[tool.hatch.build.targets.wheel.force-include]
"cookiecutter.json" = "research_foundry/templates/cookiecutter.json"
"_shared" = "research_foundry/templates/_shared"
"methodology" = "research_foundry/templates/methodology"
"workspace" = "research_foundry/templates/workspace"
"paper" = "research_foundry/templates/paper"
"software" = "research_foundry/templates/software"
"skills" = "research_foundry/skills"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "interrogate>=1.7.0",
    "isort>=9.0.2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.4.0",
    "packaging>=26.3",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "pylint>=4.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
