[project]
name = "{{ cookiecutter.repo_name }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
{%- if cookiecutter.license != "none" %}
license = "{{ cookiecutter.license }}"
{%- endif %}
authors = [{ name = "{{ cookiecutter.author_name }}" }]
requires-python = ">={{ cookiecutter._python_floor }}"
dependencies = [
{%- if cookiecutter.ml_pytorch == "yes" %}
    "numpy>=2.5.3",
    "torch>=2.14.1",
{%- endif %}
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pylint>=4.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
{%- if cookiecutter.public_docs == "yes" %}
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.22.0",
    "sphinx>=9.1.0",
]
{%- endif %}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]
{%- if cookiecutter.ml_pytorch == "yes" %}

[tool.uv]
# Locking fails unless both platforms have a wheel for every dependency.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
{%- if cookiecutter.cuda_source == "cu126" %}

# Linux takes torch from the CUDA 12.6 index, for drivers older than 580.
# macOS keeps PyPI's build, which runs on MPS.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
{%- endif %}
{%- endif %}
